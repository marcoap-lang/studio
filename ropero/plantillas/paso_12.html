ca sus 2 agujeros.</text><circle cx="16.00" cy="83.00" r="12.5" fill="none" stroke="#6B7B78" stroke-width=".6" stroke-dasharray="1.5 1"/><line x1="0.50" y1="83.00" x2="31.50" y2="83.00" stroke="#1F2A2E" stroke-width="0.25" /><line x1="16.00" y1="67.50" x2="16.00" y2="98.50" stroke="#1F2A2E" stroke-width="0.25" /><circle cx="16.00" cy="83.00" r=".5" fill="#1F2A2E"/><text x="42.00" y="82.00" font-size="3.6" fill="#6B7B78" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >Ventilación</text><text x="42.00" y="87.00" font-size="2.9" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >Sierra copa ⌀25, de lado a lado (solo en el fondo).</text><text x="8.00" y="102.00" font-size="5" fill="#1F2A2E" text-anchor="start" font-weight="600" font-family="Fraunces,system-ui,sans-serif" >Partes de la hoja</text><text x="8.00" y="110.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Círculo naranja con número:</text><text x="70.00" y="110.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >número de pieza (está escrito a lápiz en la pieza).</text><text x="8.00" y="116.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Cara:</text><text x="70.00" y="116.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >qué cara va hacia ti. «En espejo» = la pieza está volteada (cara de abajo hacia ti).</text><text x="8.00" y="122.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Miniatura arriba a la derecha:</text><text x="70.00" y="122.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >la pieza completa; el rectángulo naranja es esta hoja.</text><text x="
