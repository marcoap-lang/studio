a sus 2 agujeros.</text><circle cx="16.00" cy="83.00" r="12.5" fill="none" stroke="#6B7B78" stroke-width=".6" stroke-dasharray="1.5 1"/><line x1="0.50" y1="83.00" x2="31.50" y2="83.00" stroke="#1F2A2E" stroke-width="0.25" /><line x1="16.00" y1="67.50" x2="16.00" y2="98.50" stroke="#1F2A2E" stroke-width="0.25" /><circle cx="16.00" cy="83.00" r=".5" fill="#1F2A2E"/><text x="42.00" y="82.00" font-size="3.6" fill="#6B7B78" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >Ventilación</text><text x="42.00" y="87.00" font-size="2.9" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >Sierra copa ⌀25, de lado a lado (solo en el fondo).</text><text x="8.00" y="102.00" font-size="5" fill="#1F2A2E" text-anchor="start" font-weight="600" font-family="Fraunces,system-ui,sans-serif" >Partes de la hoja</text><text x="8.00" y="110.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Círculo naranja con número:</text><text x="70.00" y="110.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >número de pieza (está escrito a lápiz en la pieza).</text><text x="8.00" y="116.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Cara:</text><text x="70.00" y="116.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >qué cara va hacia ti. «En espejo» = la pieza está volteada (cara de abajo hacia ti).</text><text x="8.00" y="122.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Miniatura arriba a la derecha:</text><text x="70.00" y="122.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >la pieza completa; el rectángulo naranja es esta hoja.</text><text x="8.00" y="128.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• L naranja:</text><text x="70.00" y="128.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >esquina real de la pieza: empújala contra la esquina del tablero.</text><text x="8.00" y="134.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Línea gruesa:</text><text x="70.00" y="134.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >canto de la pieza. «Canto de referencia» = desde donde se mide.</text><text x="8.00" y="140.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Franja verde:</text><text x="70.00" y="140.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >traslape: aquí se encima la hoja siguiente. Las letras A↔A, B↔B deben coincidir.</text><text x="8.00" y="146.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• ✂ línea punteada naranja:</text><text x="70.00" y="146.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >recorta el margen de la hoja por aquí antes de encimarla.</text><text x="8.00" y="152.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="700" font-family="Inter,system-ui,sans-serif" >• Etiqueta U##:</text><text x="70.00" y="152.00" font-size="3" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >número de unión; coincide con la lámina del paso en el sitio.</text><text x="8.00" y="162.00" font-size="5" fill="#1F2A2E" text-anchor="start" font-weight="600" font-family="Fraunces,system-ui,sans-serif" >Herramienta</text><text x="8.00" y="170.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Impresora (papel carta) y tijeras</text><text x="107.95" y="170.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Cinta masking</text><text x="8.00" y="176.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Flexómetro (para la regla de 10 cm)</text><text x="107.95" y="176.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Punzón o clavo + martillo</text><text x="8.00" y="182.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Taladro y brocas ⌀2, ⌀3 mm; avellanador ⌀8 mm</text><text x="107.95" y="182.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Plantilla Kreg + broca escalonada 3/8″ con collar</text><text x="8.00" y="188.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Sierra copa ⌀25 (ventilación del fondo)</text><text x="107.95" y="188.00" font-size="3.1" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >☐ Cinta de color para la bandera de profundidad</text><rect x="8" y="200" width="199.9" height="26" rx="2" fill="#fff" stroke="#D9502B" stroke-width=".8"/><text x="12.00" y="207.00" font-size="3.4" fill="#D9502B" text-anchor="start" font-weight="800" font-family="Inter,system-ui,sans-serif" >Ventanas de las tapas caladas 28–29 (paso 12) · caladora</text><text x="12.00" y="213.00" font-size="2.6" fill="#1F2A2E" text-anchor="start" font-weight="500" font-family="Inter,system-ui,sans-serif" >1) Pega la hoja, punzona y barrena ⌀10 pasado en las 4 esquinas de cada ventana (dan el radio 5). 2) Traza las rectas e
